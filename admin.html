<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Sohoj Nittoloy</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="container nav"><a class="brand" href="index.html"><img id="adminLogo" src="assets/logo.jpg" onerror="this.style.display='none'" alt=""><span>Sohoj Nittoloy</span></a><div class="headerActions"><button id="themeToggle" class="themeToggle" aria-label="Toggle theme">🌙</button><a class="btn" href="index.html">Website</a></div></div></header>
<main class="admin"><div class="container">
<section id="loginBox" class="panel"><b>Admin Login</b><h1>Admin Login</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary">Login</button></form><p id="loginMsg"></p></section>
<section id="adminBox" class="panel hidden"><div class="head"><div><b>Dashboard</b><h1>Product Management</h1></div><button id="logoutBtn" class="btn">Logout</button></div>
<form id="productForm"><h2 id="formTitle">Add Product</h2><label>Product Name<input id="pName" required></label><div class="two"><label>Price<input id="pPrice" type="number" min="0" step=".01" required></label><label>Old Price<input id="pOldPrice" type="number" min="0" step=".01"></label><label>Quantity<input id="pQuantity" type="number" min="0" step="1" value="0" required></label></div><label>Category<select id="pCategory"><option>Kitchen & Cookware</option><option>Electrical Appliances</option><option>Home & Furniture</option><option>Household Essentials</option><option>Home Accessories</option></select></label><label>Description<textarea id="pDescription"></textarea></label><label>Images (JPG, PNG, WebP, max 10MB each)<input id="pImage" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label>Videos (MP4, WebM, max 50MB each)<input id="pVideo" type="file" accept="video/mp4,video/webm" multiple></label><label><input id="pFeatured" type="checkbox"> Featured Product</label><button id="formSubmit" class="btn primary">Add Product</button><button id="cancelEdit" type="button" class="btn hidden">Cancel edit</button><p id="formMsg"></p></form><section class="panel logoPanel"><h2>Logo Management</h2><img id="logoPreview" class="logoPreview" src="assets/logo.jpg" alt="Current logo"><label>Replace logo (JPG, PNG, WebP, max 5MB)<input id="logoInput" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="logoUpload" class="btn primary" type="button">Upload Logo</button><p id="logoMsg"></p></section><hr><h2>Current Products</h2><div id="adminProducts"></div></section>
</div></main><style>.logoPanel{margin-top:24px}.logoPreview{display:block;width:110px;height:110px;object-fit:contain;border:1px solid #e5e7eb;border-radius:10px;padding:8px}.edit{border:1px solid #b7d9ca;background:#ecfdf5;color:#087f5b;border-radius:8px;padding:8px;cursor:pointer}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
