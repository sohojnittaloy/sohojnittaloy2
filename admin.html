<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Sohoj Nittoloy</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="container nav"><a class="brand" href="index.html">Sohoj Nittoloy</a><div class="headerActions"><button id="themeToggle" class="themeToggle" aria-label="Toggle theme">🌙</button><a class="btn" href="index.html">Website</a></div></div></header>
<main class="admin"><div class="container">
<section id="loginBox" class="panel"><b>Admin Login</b><h1>Admin Login</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary">Login</button></form><p id="loginMsg"></p></section>
<section id="adminBox" class="panel hidden"><div class="head"><div><b>Dashboard</b><h1>Product Management</h1></div><button id="logoutBtn" class="btn">Logout</button></div>
<form id="productForm"><label>Product Name<input id="pName" required></label><div class="two"><label>Price<input id="pPrice" type="number" min="0" step=".01" required></label><label>Old Price<input id="pOldPrice" type="number" min="0" step=".01"></label><label>Quantity<input id="pQuantity" type="number" min="0" step="1" value="0" required></label></div><label>Category<select id="pCategory"><option>Kitchen & Cookware</option><option>Electrical Appliances</option><option>Home & Furniture</option><option>Household Essentials</option><option>Home Accessories</option></select></label><label>Description<textarea id="pDescription"></textarea></label><label>Image<input id="pImage" type="file" accept="image/*" required></label><label><input id="pFeatured" type="checkbox"> Featured Product</label><button class="btn primary">Add Product</button><p id="formMsg"></p></form><hr><h2>Current Products</h2><div id="adminProducts"></div></section>
</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
