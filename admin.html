<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Shohaj Nittaloy</title><link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
<header class="site-header"><div class="container nav"><a class="brand" href="index.html">Shohaj Nittaloy</a><nav><a href="index.html">View Website</a></nav></div></header>
<main class="admin-wrap"><div class="container">
  <div id="loginBox" class="admin-panel">
    <p class="eyebrow">ADMIN LOGIN</p><h1>Admin Panel</h1>
    <p class="muted">Sign in with your Supabase Auth email and password.</p>
    <form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn primary" type="submit">Login</button><p id="loginMsg" class="form-msg"></p></form>
  </div>

  <div id="dashboard" class="hidden">
    <div class="admin-top"><div><p class="eyebrow">DASHBOARD</p><h1>Manage Products</h1></div><button id="logout" class="btn light">Logout</button></div>
    <div class="admin-panel">
      <h2>Add New Product</h2>
      <form id="productForm" class="product-form">
        <input id="pName" placeholder="Product name" required>
        <input id="pPrice" type="number" step="0.01" placeholder="Price (৳)" required>
        <input id="pOldPrice" type="number" step="0.01" placeholder="Previous price (optional)">
        <select id="pCategory"><option value="grocery">Grocery</option><option value="household">Household</option><option value="new">New Arrivals</option></select>
        <input id="pImage" type="file" accept="image/*" required>
        <textarea id="pDescription" placeholder="Short product description"></textarea>
        <label class="check"><input id="pFeatured" type="checkbox"> Show as featured product</label>
        <button class="btn primary" type="submit">Add Product</button>
        <p id="productMsg" class="form-msg"></p>
      </form>
    </div>
    <div class="admin-panel"><div class="section-head"><h2>Your Products</h2><button id="refresh" class="btn light">Refresh</button></div><div id="adminProducts" class="admin-products"></div></div>
  </div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
