<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নিত্যালয় Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><div class="wrap"><header><a href="index.html">← নিত্যালয় Website</a></header><section id="login" class="panel"><h1>Admin Login</h1><p>পণ্য যোগ ও পরিচালনার জন্য লগইন করুন।</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginMsg"></p></section><section id="dash" class="panel hidden"><div class="top"><h1>পণ্য যোগ করুন</h1><button id="logout" class="light">Logout</button></div><label>পণ্যের ছবি</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><label>পণ্যের নাম</label><input id="name" placeholder="যেমন: ননস্টিক কুকার"><label>ক্যাটাগরি</label><input id="category" placeholder="কুকারিজ / ইলেকট্রনিক"><label>দাম</label><input id="price" placeholder="যেমন: ৳ 1,500"><label>বিবরণ</label><textarea id="description" rows="4"></textarea><button id="save">পণ্য Save করুন</button><p id="msg"></p><h2>পণ্য তালিকা</h2><div id="list"></div></section></div><script src="admin.js"></script></body></html>
